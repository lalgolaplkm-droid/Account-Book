name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # এই দুটি লাইন পুরোনো ও নষ্ট গ্রেডল ফাইলগুলো মুছে ফেলবে এবং একদম ফ্রেশ অ্যান্ড্রয়েড ফোল্ডার তৈরি করে নেবে:
      - name: Clean and Recreate Android
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=account_book

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
